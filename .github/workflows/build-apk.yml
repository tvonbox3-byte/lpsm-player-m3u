name: Gerar APK LPSM

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LPSM_KEYSTORE_PATH: ${{ github.workspace }}/lpsm-release.jks
      LPSM_KEYSTORE_PASSWORD: ${{ secrets.LPSM_KEYSTORE_PASSWORD }}
      LPSM_KEY_ALIAS: ${{ secrets.LPSM_KEY_ALIAS }}
      LPSM_KEY_PASSWORD: ${{ secrets.LPSM_KEY_PASSWORD }}

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: Restaurar chave de assinatura LPSM
        env:
          LPSM_KEYSTORE_BASE64: ${{ secrets.LPSM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LPSM_KEYSTORE_BASE64" | base64 --decode > "$LPSM_KEYSTORE_PATH"


      - name: Verificar chave de assinatura
        run: |
          keytool -list \
            -keystore "$LPSM_KEYSTORE_PATH" \
            -storepass "$LPSM_KEYSTORE_PASSWORD" \
            -alias "$LPSM_KEY_ALIAS" > /dev/null

          echo "Chave LPSM carregada corretamente."


      - name: Ler versão do aplicativo
        id: app_version
        working-directory: android
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Versão: $VERSION_NAME"
          echo "VersionCode: $VERSION_CODE"


      - name: Gerar APK Release assinado
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace


      - name: Preparar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/LPSM-Player.apk


      - name: Criar informações da atualização
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/LPSM-Player.apk",
            "force": false,
            "message": "Uma nova versão do LPSM está disponível."
          }
          EOF

          echo "Arquivo de atualização criado:"
          cat update.json


      - name: Salvar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: LPSM-Player-Release
          path: android/app/build/outputs/apk/release/LPSM-Player.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publicar atualização no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release $TAG já existe."

          else

            gh release create "$TAG" \
              --title "LPSM ${VERSION_NAME}" \
              --notes "Versão ${VERSION_NAME} do LPSM. VersionCode ${VERSION_CODE}."

          fi

          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/LPSM-Player.apk \
            update.json \
            --clobber

          echo "APK e update.json publicados."
