<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LPSM Control</title><link rel="stylesheet" href="/styles.css"></head><body>
<main><header><div><span class="brand">LPSM</span><small>CONTROL</small></div><button id="logout" class="ghost hidden">Sair</button></header>
<section id="login" class="card login"><h1>Painel de controle</h1><p>Gerencie clientes, listas autorizadas e a aparência do aplicativo.</p><form id="loginForm"><label>Usuário<input name="user" autocomplete="username" required value="admin"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><output></output></form></section>
<section id="dashboard" class="hidden"><div class="hero"><div><p class="eyebrow">VISÃO GERAL</p><h1>Operação LPSM</h1><p id="summary"></p></div><button id="refresh" class="ghost">Atualizar</button></div>
<nav><button data-tab="clients" class="active">Clientes</button><button data-tab="playlists">Listas</button><button data-tab="appearance">Aparência</button><button data-tab="audit">Logs</button></nav>
<div id="clients" class="tab"><div class="section-title"><h2>Clientes e dispositivos</h2><button data-open="clientDialog">Novo cliente</button></div><div id="clientList" class="grid"></div></div>
<div id="playlists" class="tab hidden"><div class="section-title"><h2>Listas M3U</h2><button data-open="playlistDialog">Nova lista</button></div><div id="playlistList" class="grid"></div></div>
<div id="appearance" class="tab hidden"><div class="section-title"><h2>Identidade visual</h2></div><form id="appearanceForm" class="card form-grid"><label>URL do banner<input name="bannerUrl" type="url"></label><label>URL do papel de parede<input name="wallpaperUrl" type="url"></label><label class="wide">Mensagem de suporte<input name="supportMessage"></label><button>Salvar aparência</button></form></div>
<div id="audit" class="tab hidden"><div class="section-title"><h2>Atividade recente</h2></div><div id="auditList" class="card"></div></div></section></main>
<dialog id="clientDialog"><form id="clientForm" method="dialog"><h2>Novo cliente</h2><label>Nome<input name="name" required></label><label>ID do dispositivo<input name="deviceId" required></label><label>Código de ativação<input name="activationCode" placeholder="Gerado automaticamente"></label><label>Status<select name="enabled"><option value="true">Ativo</option><option value="false">Inativo</option></select></label><label>Expiração<input name="expiresAt" type="date"></label><fieldset><legend>Listas permitidas</legend><div id="playlistChecks"></div></fieldset><div class="actions"><button type="button" class="ghost close">Cancelar</button><button value="default">Criar</button></div></form></dialog>
<dialog id="playlistDialog"><form id="playlistForm" method="dialog"><h2>Nova lista autorizada</h2><label>Nome<input name="name" required></label><label>URL M3U<input name="url" type="url" required></label><label>URL XMLTV (opcional)<input name="xmltvUrl" type="url"></label><label>Expiração<input name="expiresAt" type="date"></label><div class="actions"><button type="button" class="ghost close">Cancelar</button><button value="default">Criar</button></div></form></dialog>
<script src="/app.js" type="module"></script></body></html>
