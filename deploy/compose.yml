services:
  lpsm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
    volumes:
      - lpsm_data:/app/data
    networks: [web]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      LPSM_DOMAIN: ${LPSM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [web]
volumes:
  lpsm_data:
  caddy_data:
networks:
  web:
